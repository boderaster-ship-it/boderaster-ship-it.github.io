name: Pionex Fifteen-Minute Research
on:
  workflow_dispatch:
  push:
    paths:
      - 'pionex-leadlag/leadlag_15m.py'
      - 'pionex-leadlag/test_lag15m.py'
      - '.github/workflows/pionex-lag15m.yml'
  schedule:
    - cron: '24 4,10,16,22 * * *'
permissions:
  contents: write
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate time-ordered lag research
        run: python -m unittest discover -s pionex-leadlag -p 'test_lag15m.py' -v
      - run: python pionex-leadlag/leadlag_15m.py
