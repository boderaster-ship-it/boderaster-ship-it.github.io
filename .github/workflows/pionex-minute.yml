name: Legacy Minute Import (Manual Only)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pionex-minute.yml"
permissions:
  contents: write
concurrency:
  group: pionex-minute-archive
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Maintain incremental 14-day Pionex minute history
        run: python pionex-leadlag/analysis.py minute
