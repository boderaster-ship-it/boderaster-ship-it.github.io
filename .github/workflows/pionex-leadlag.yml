name: Pionex BTC Lead-Lag Research
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "pionex-leadlag/analysis.py"
      - ".github/workflows/pionex-leadlag.yml"
permissions:
  contents: write
concurrency:
  group: pionex-hourly-data
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and analyze Pionex public market data
        run: python pionex-leadlag/analysis.py
