name: Pionex BTC Lead-Lag Research
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "pionex-leadlag/trading_v5.py"
      - "pionex-leadlag/test_v5.py"
      - "pionex-leadlag/trading_v4.py"
      - "pionex-leadlag/analysis.py"
      - ".github/workflows/pionex-leadlag.yml"
permissions:
  contents: write
concurrency:
  group: pionex-hourly-data
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate model logic and chronological safety
        run: python -m unittest discover -s pionex-leadlag -p "test_v5.py" -v
      - name: Download and analyze Pionex public market data
        run: python pionex-leadlag/trading_v5.py
