<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070b12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Plasmid Frontier"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><title>Plasmid Frontier</title></head><body><div id="app"><header class="top"><div class="brand"><h1>PLASMID FRONTIER</h1><p>EVOLUTION UNDER PRESSURE</p></div><div class="stats"><div class="stat"><b id="pop">0</b><span>Cells</span></div><div class="stat"><b id="gen">1</b><span>Gen</span></div><div class="stat"><b id="score">0</b><span>Score</span></div></div></header><main class="stage" id="stage"><canvas id="c"></canvas><div class="overlay"><div class="pill" id="phase">STABLE MEDIUM</div><div class="pill" id="diversity">DIVERSITY 0%</div></div><div id="toast"><b></b><span></span></div></main><section class="controls"><div class="meter"><span>Adaptation</span><div class="bar"><div class="fill" id="adaptFill"></div></div><strong id="adaptText">0%</strong></div><div class="buttons"><button class="btn active" data-mode="feed">NUTRIENT<small>tap plate</small></button><button class="btn" data-mode="a">DRUG A<small>selection</small></button><button class="btn" data-mode="b">DRUG B<small>selection</small></button><button class="btn" data-mode="flush">FLUSH<small>reset stress</small></button></div><div class="footer"><span id="hint">Tap the dish to place a nutrient bloom.</span><span>BEST <b id="best">0</b></span></div></section></div><script src="./app.js" defer></script></body></html>
