<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e8dcc1"><title>FOLDWORLD</title><style>html,body{margin:0;width:100%;height:100%;background:#e8dcc1;font-family:system-ui,sans-serif}.loading{min-height:100%;display:grid;place-items:center;color:#2e2a23}.err{max-width:320px;padding:24px;text-align:center;line-height:1.4}</style></head><body><div class="loading" id="boot">Loading FOLDWORLD…</div><script>(async()=>{try{const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)throw new Error('index '+r.status);let html=await r.text();const injection='<script src="touchfix.js?v=2"><\/script>';if(!html.includes('touchfix.js'))html=html.replace('</body>',injection+'</body>');document.open();document.write(html);document.close()}catch(err){document.getElementById('boot').innerHTML='<div class="err"><b>FOLDWORLD could not start.</b><br>'+String(err.message||err)+'</div>'}})();</script></body></html>
